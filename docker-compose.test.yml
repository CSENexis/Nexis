services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexis_test
      POSTGRES_PASSWORD: nexis_test_password
      POSTGRES_DB: nexis_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexis_test -d nexis_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  test-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg://nexis_test:nexis_test_password@test-db:5432/nexis_test
      - REDIS_URL=redis://test-redis:6379/0
      - SECRET_KEY=test_secret_key_at_least_32_characters_long_for_security
      - HMAC_KEY=test_hmac_key_for_nexis_mfa_testing_purpose_only
      - TOTP_ENC_KEY=eXxBzHmNDOjXGYpGCrNJTe9Du38J-v2pE34_yULBgko=
      - COOKIE_SECURE=false
      - ENV=test
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: pytest -v
